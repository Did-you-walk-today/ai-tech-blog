# The layout text of site
#
# ---------------------------------------------------------------------------
# COPIED FROM jekyll-theme-chirpy 7.5.0 (_data/locales/en.yml).
#
# Jekyll replaces a theme data file wholesale when the site defines the same
# path, so this file must stay a full copy — not a partial override. When the
# theme is upgraded, diff it against the gem's copy and port any new keys:
#
#   diff _data/locales/en.yml \
#     "$(bundle show jekyll-theme-chirpy)/_data/locales/en.yml"
#
# Local additions are limited to the `tabs:` block and marked there.
# ---------------------------------------------------------------------------

# ----- Commons label -----

layout:
  post: Post
  category: Category
  tag: Tag

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Home
  categories: Categories
  tags: Tags
  archives: Archives
  about: About

  # --- Local additions ------------------------------------------------------
  # Chirpy reads this block with two different keys, which is why custom tabs
  # need two entries each:
  #
  #   _includes/head.html   -> tabs[page.title | downcase]   => the <title> tag
  #   _includes/sidebar.html, topbar.html
  #                         -> tabs[<url slug>]              => nav / breadcrumb
  #
  # head.html has no `| default: page.title` fallback, so a custom tab with no
  # entry here renders an EMPTY <title>. That was the Bing "duplicate/short
  # title" defect on all 7 tabs.
  #
  # Keep the two key sets distinct: a tab whose title downcases to its own url
  # slug would force one string to serve both roles (a long SEO title would
  # then leak into the sidebar). Tab titles are set so this never collides.

  # <title> text — keyed by downcased page.title
  "ai models": "Best LLM Comparisons & Benchmarks"
  "ai tools": "AI Developer Tools & Coding Assistants"
  "prompt engineering": "Prompt Engineering Guides & Templates"
  "ai productivity": "AI Productivity & Workflow Automation"
  "ai data": "AI Data & Statistics: Structured Datasets"
  "industry analysis": "AI Industry Analysis: Crawlers, Ads & Citations"
  "ai safety": "AI Safety & Ethics: Platform Content Policy"
  "editorial methodology": "Editorial Methodology & Data Sourcing"

  # Nav / breadcrumb text — keyed by url slug
  "ai-models": "AI Models"
  "ai-tools": "AI Tools"
  "prompts": "Prompts"
  "productivity": "Productivity"
  "data": "Data"
  "industry": "Industry"
  "safety": "Safety"
  "methodology": "Methodology"
  # --- End local additions --------------------------------------------------

# the text displayed in the search bar & search results
search:
  hint: search
  cancel: Cancel
  no_results: Oops! No results found.

panel:
  lastmod: Recently Updated
  trending_tags: Trending Tags
  toc: Contents

copyright:
  # Shown at the bottom of the post
  license:
    template: This post is licensed under :LICENSE_NAME by the author.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: Some rights reserved.
  verbose: >-
    Except where otherwise noted, the blog posts on this site are licensed
    under the Creative Commons Attribution 4.0 International (CC BY 4.0) License by the author.

meta: Using the :THEME theme for :PLATFORM.

not_found:
  statement: Sorry, we've misplaced that URL or it's pointing to something that doesn't exist.

notification:
  update_found: A new version of content is available.
  update: Update

# ----- Posts related labels -----

post:
  written_by: By
  posted: Posted
  updated: Updated
  words: words
  pageview_measure: views
  read_time:
    unit: min
    prompt: read
  relate_posts: Further Reading
  share: Share
  button:
    next: Newer
    previous: Older
    copy_code:
      succeed: Copied!
    share_link:
      title: Copy link
      succeed: Link copied successfully!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: category
    plural: categories
  post_measure:
    singular: post
    plural: posts
